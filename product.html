<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexiaStore - App Details</title>
    <link rel="icon" type="image/png" href="NexiaStore.png">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Style CSS (গ্লোবাল ডার্ক ব্যাকগ্রাউন্ড ও হেডারের জন্য) -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Product Page CSS (প্রডাক্ট পেজের নিজস্ব লেআউট ও কার্ডের জন্য) -->
    <link rel="stylesheet" href="product.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <a href="index.html" class="brand">
            <img src="NexiaStore.png" alt="NexiaStore Logo" class="brand-logo">
            <span class="brand-title">NEXIA<span>STORE</span></span>
        </a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search apps...">
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="productWrapper" class="product-wrapper">
        <!-- JS দিয়ে ডায়নামিক অ্যাপ ইনফো লোড হবে -->
    </main>

    <!-- JavaScript File -->
    <script type="module" src="product.js"></script>

</body>
</html>
