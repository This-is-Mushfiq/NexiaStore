<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexiaStore - Official App Store</title>
    <link rel="icon" type="image/png" href="NexiaStore.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <img src="NexiaStore.png" alt="NexiaStore Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/60?text=Nexia'">
            <h1 class="brand-title">NEXIA<span>STORE</span></h1>
        </a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search apps...">
        </div>
    </header>

    <main>
        <section class="hero-section">
            <h1 class="hero-title">NEXIA STORE APP HUB</h1>
            <p style="color: var(--text-sub);">সব সিকিউরড ও অফিশিয়াল অ্যান্ড্রয়েড অ্যাপস একদম ফ্রীতে ডাউনলোড করুন</p>
        </section>

        <section class="app-grid" id="mainAppGrid">
            <p style="text-align: center; grid-column: 1/-1;">অ্যাপস লোড হচ্ছে...</p>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
